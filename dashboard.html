async function addExtraTrip(ev, plate, start, end) {
  ev.preventDefault();
  const date = document.getElementById('extra-date').value;
  const description = document.getElementById('extra-desc').value.trim();
  const liters = parseFloat(document.getElementById('extra-liters').value);
  const note = document.getElementById('extra-note').value.trim() || null;
  if (!date || !description || !liters || liters <= 0) return;
  if (date < start || date > end) { alert('วันที่ต้องอยู่ในช่วงรอบนี้ (' + start + ' ถึง ' + end + ')'); return; }
  try {
    const r = await ths.from('extra_trips').insert({truck_plate: plate, date, description, liters, note});
    if (r.error) throw r.error;
    reload();
  } catch (e) {
    setError('บันทึกไม่สำเร็จ: ' + e.message);
  }
}

function updateFuelAmount() {
  const l = parseFloat(document.getElementById('fuel-liters').value) || 0;
  const r = parseFloat(document.getElementById('fuel-rate').value) || 0;
  const amt = l * r;
  // อัพเดทเฉพาะถ้า user ไม่ได้แก้ amount เอง (เช็คจาก data-manual flag)
  const amountField = document.getElementById('fuel-amount');
  if (!amountField.dataset.manual) {
    amountField.value = amt > 0 ? amt.toFixed(2) : '';
  }
}

function fillRecommended(liters) {
  document.getElementById('fuel-liters').value = liters;
  updateFuelAmount();
}

async function addFuelOutcome(ev, plate, start, end) {
  ev.preventDefault();
  const date = document.getElementById('fuel-date').value;
  const liters = parseFloat(document.getElementById('fuel-liters').value);
  const rate = parseFloat(document.getElementById('fuel-rate').value);
  const amountInput = parseFloat(document.getElementById('fuel-amount').value);
  // ใช้ค่าที่ user กรอกใน amount field; ถ้าว่างใช้ liters × rate
  const amount = amountInput > 0 ? amountInput : (liters * rate);
  const note = document.getElementById('fuel-note').value.trim() || null;
  if (!date || !liters || liters <= 0 || !rate || rate <= 0 || !amount || amount <= 0) return;
  if (date < start || date > end) { alert('วันที่ต้องอยู่ในช่วงรอบนี้'); return; }
  try {
    const finalNote = note || (Math.abs(amount - liters * rate) > 0.01 ? `เติม ${liters} ล. × ${rate} = ${(liters*rate).toFixed(2)} (override: ${amount.toFixed(2)})` : null);
    const r = await ths.from('outcomes').insert({truck_plate: plate, date, category: 'ค่าน้ำมัน', liters, amount, note: finalNote});
    if (r.error) throw r.error;
    reload();
  } catch (e) { setError('บันทึกค่าน้ำมันไม่สำเร็จ: ' + e.message); }
}

const DELETE_CODE = '625465';
let __deleteModalResolver = null;

// Preset ข้อความตามบริบท — ส่ง 'delete' (default) หรือ 'edit'
const MODAL_PRESETS = {
  delete: {
    icon: '🔒',
    title: 'ยืนยันการลบ',
    msg:   'กรุณาใส่รหัสยืนยันเพื่อลบข้อมูลนี้',
    btn:   'ยืนยันการลบ',
    btnBg: 'var(--danger)'
  },
  edit: {
    icon: '✏️',
    title: 'ยืนยันการเปลี่ยน',
    msg:   'กรุณาใส่รหัสยืนยันเพื่อแก้ไขข้อมูลนี้',
    btn:   'ยืนยันการเปลี่ยน',
    btnBg: 'var(--accent)'
  }
};

function requireDeleteCode(kind = 'delete') {
  return new Promise(resolve => {
    __deleteModalResolver = resolve;
    const preset = MODAL_PRESETS[kind] || MODAL_PRESETS.delete;
    // ปรับ icon / title / msg / button text
    const iconEl = document.querySelector('#delete-modal .modal-icon');
    const titleEl = document.querySelector('#delete-modal .modal-title');
    const msgEl = document.querySelector('#delete-modal .modal-msg');
    const btnEl = document.querySelector('#delete-modal .btn-confirm');
    if (iconEl) iconEl.textContent = preset.icon;
    if (titleEl) titleEl.textContent = preset.title;
    if (msgEl) msgEl.textContent = preset.msg;
    if (btnEl) {
      btnEl.textContent = preset.btn;
      btnEl.style.background = preset.btnBg;
    }
    document.getElementById('modal-pin').value = '';
    document.getElementById('modal-error').style.display = 'none';
    document.getElementById('delete-modal').style.display = 'flex';
    setTimeout(() => document.getElementById('modal-pin').focus(), 60);
  });
}

function closeDeleteModal(confirmed) {
  const pin = document.getElementById('modal-pin').value;
  if (confirmed) {
    if (pin !== DELETE_CODE) {
      document.getElementById('modal-error').style.display = 'block';
      document.getElementById('modal-pin').value = '';
      document.getElementById('modal-pin').focus();
      return;  // อย่าปิด modal — ให้ลองใหม่
    }
  }
  document.getElementById('delete-modal').style.display = 'none';
  if (__deleteModalResolver) {
    __deleteModalResolver(confirmed && pin === DELETE_CODE);
    __deleteModalResolver = null;
  }
}

// Enter = confirm, Esc = cancel
document.addEventListener('keydown', e => {
  const modal = document.getElementById('delete-modal');
  if (!modal || modal.style.display === 'none') return;
  if (e.key === 'Enter') { e.preventDefault(); closeDeleteModal(true); }
  if (e.key === 'Escape') { e.preventDefault(); closeDeleteModal(false); }
});

/**
 * แก้ note ของ outcome
 * Flow: prompt note ใหม่ → ใส่ PIN ยืนยัน → update DB
 * ใช้ PIN เพราะ "แก้ข้อมูลใน DB" ก็ต้อง audit เหมือน "ลบ"
 */
async function editOutcomeNote(id, currentNote) {
  const newNote = prompt('แก้หมายเหตุ:', currentNote || '');
  if (newNote === null) return;                    // user กด Cancel
  if (newNote.trim() === (currentNote || '').trim()) return;   // ไม่มีการเปลี่ยน
  // ใส่ PIN ก่อนเขียน DB (modal จะขึ้นว่า "ยืนยันการเปลี่ยน")
  if (!(await requireDeleteCode('edit'))) return;
  try {
    const r = await ths.from('outcomes').update({ note: newNote.trim() || null }).eq('id', id);
    if (r.error) throw r.error;
    reload();
  } catch (e) {
    setError('แก้ไขไม่สำเร็จ: ' + e.message);
  }
}
