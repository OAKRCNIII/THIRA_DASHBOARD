<style>
  /* ── iOS-style reset ── */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Sarabun', 'SF Pro Text', system-ui, sans-serif;
    margin: 0;
    background: #f2f2f7;          /* iOS systemGroupedBackground */
    color: #1c1c1e;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
    min-height: 100vh;
    overscroll-behavior-y: contain;
  }
  a { color: inherit; text-decoration: none; -webkit-user-drag: none; }
  button { font-family: inherit; }
  input, select { font-family: inherit; -webkit-appearance: none; appearance: none; }
  input:focus { outline: none; }

  /* ── Top sticky header ── */
  .top {
    background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%);
    color: white;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 12px;
    position: sticky; top: 0; z-index: 50;
    box-shadow: 0 1px 0 rgba(0,0,0,0.1);
  }
  .top-row { display: flex; justify-content: space-between; align-items: center; }
  .top-row h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.2px; }
  .top-row .actions { display: flex; gap: 6px; }
  .icon-btn {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.18);
    border: 0; border-radius: 18px;
    color: white; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.15s;
  }
  .icon-btn:active { background: rgba(255,255,255,0.35); }

  .period-bar {
    display: flex; gap: 6px; margin-top: 10px; align-items: center;
  }
  .period-input {
    flex: 1;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    color: white;
    padding: 8px 12px; border-radius: 10px;
    font-size: 15px; text-align: center;
    font-weight: 600; letter-spacing: 0.5px;
  }
  .period-input::placeholder { color: rgba(255,255,255,0.5); }
  .period-nav {
    background: rgba(255,255,255,0.15); border: 0;
    width: 36px; height: 36px; border-radius: 18px;
    color: white; font-size: 14px; cursor: pointer;
  }
  .period-nav:active { background: rgba(255,255,255,0.35); }
  .period-label {
    flex-shrink: 0; font-size: 11px; opacity: 0.7;
    text-align: right; padding-left: 6px;
  }

  /* ── Status / Error ── */
  .status, .error {
    margin: 12px 16px; padding: 10px 14px; border-radius: 10px;
    font-size: 14px; font-weight: 500;
  }
  .status { background: #fef3c7; color: #92400e; }
  .error { background: #fee2e2; color: #991b1b; }

  /* ── Section ── */
  .section { padding: 14px 16px 6px; font-size: 12px; color: #6b7280; font-weight: 600;
             text-transform: uppercase; letter-spacing: 0.5px; }
  .section:first-of-type { padding-top: 8px; }

  /* ── Fleet KPI ── */
  .fleet-kpi {
    background: white;
    margin: 0 16px 8px;
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);
  }
  .fleet-kpi h3 { margin: 0 0 10px; font-size: 13px; color: #6b7280; font-weight: 600; }
  .fleet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fleet-cell {
    padding: 10px 12px; border-radius: 10px;
    background: #f7f7f8;
  }
  .fleet-cell .label { font-size: 11px; color: #6b7280; font-weight: 500; }
  .fleet-cell .value {
    font-size: 17px; font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-top: 3px; color: #1c1c1e;

  .fleet-cell.paid { background: #ecfdf5; }
  .fleet-cell.paid .value { color: #065f46; }
  .fleet-cell.pending { background: #fef3c7; }
  .fleet-cell.pending .value { color: #92400e; }

  /* ── Truck Card (iOS list style) ── */
  .cards-wrap {
    background: white;

    overflow: hidden;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);

  .truck-card {

  .truck-card:last-child { border-bottom: 0; }
  .truck-card:active { background: #f2f2f7; }
  .tc-header {

  .tc-profit.neg { color: #dc2626; }
  .tc-profit-label { font-size: 11px; color: #6b7280; font-weight: 500; }

  .tc-stats {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;

  .tc-badges { display: flex; gap: 6px; margin-top: 8px; }

  .detail-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: none; z-index: 200;
    animation: fadeIn 0.2s;
  }
  .detail-overlay.show { display: block; }
  @keyframes fadeIn { from {opacity:0} to {opacity:1} }
  .detail-sheet {
    position: fixed; bottom: 0; left: 0; right: 0;
    max-height: 92vh;
    background: #f2f2f7;
    border-radius: 18px 18px 0 0;
    overflow-y: auto;

    from {transform:translateY(100%)} to {transform:translateY(0)}

  .detail-header {
    background: linear-gradient(135deg, #1e3a5f, #2c5282);

  .detail-header .sub { font-size: 13px; opacity: 0.85; margin-top: 4px; font-weight: 500; }

  .detail-section {
    background: white;
    margin: 10px 12px;
    border-radius: 12px;
    padding: 12px 16px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);

  .detail-section h3 {

    display: flex; justify-content: space-between; align-items: center;

  .detail-row .lbl { color: #1c1c1e; }
  .detail-row .val { font-variant-numeric: tabular-nums; font-weight: 500; }
  .detail-row.total {
    border-top: 2px solid #1e3a5f; border-bottom: 0;

  .detail-row.total .val { font-size: 18px; font-weight: 700; }
  .detail-row.total .val.pos { color: #059669; }
  .detail-row.total .val.neg { color: #dc2626; }

  .detail-list-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 0; font-size: 14px;
    border-bottom: 0.5px solid #f2f2f7;
  }
  .detail-list-item:last-child { border-bottom: 0; }
  .detail-list-item .l { flex: 1; min-width: 0; padding-right: 8px; }
  .detail-list-item .r { font-variant-numeric: tabular-nums; font-weight: 600; flex-shrink: 0; }
  .detail-list-item .meta { font-size: 11px; color: #8e8e93; }

  /* ── Empty state ── */
  .empty {
    color: #8e8e93; font-style: italic; text-align: center;
    padding: 16px; font-size: 13px;
  }

  /* ── Small phones (Galaxy Z Fold 6 outer screen ~968px wide ตอน fold) ── */
  @media (max-width: 360px) {
    .tc-plate { font-size: 16px; }
    .tc-profit { font-size: 17px; }
    .top-row h1 { font-size: 16px; }
  }

  /* ───────────────────────────────────────────────────────────
     Galaxy Z Fold 6 — Unfolded (inner screen) — tablet layout
     7.6" 2160×1856 (~1.16:1 aspect)
     ใช้ 2-column grid + bigger cards + sidebar tabs
     ───────────────────────────────────────────────────────────  */
  @media (min-width: 720px) {
    body { font-size: 16px; }
    .top { padding: calc(env(safe-area-inset-top) + 12px) 24px 16px; }
    .top-row h1 { font-size: 20px; }

    /* รถ cards = 2 columns บนหน้า unfolded */
    .truck-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px 24px; }
    /* KPI cards ใหญ่ขึ้น */
    .kpi-row { padding: 16px 24px; gap: 12px; }
    .kpi-row .kpi { padding: 16px 18px; }
    .kpi-row .kpi .v { font-size: 22px; }

    /* Bottom nav กว้างขึ้น ปรับ padding */
    .bottom-nav { padding: 12px env(safe-area-inset-left) calc(env(safe-area-inset-bottom) + 12px); }

    /* Modal กว้างจำกัด — กลางจอ */
    .detail-modal { max-width: 720px; margin: 0 auto; border-radius: 24px 24px 0 0; }
  }

  /* Wider unfolded (landscape unfolded ~2160px) — 3-column grid */
  @media (min-width: 1100px) {
    .truck-cards { grid-template-columns: 1fr 1fr 1fr; }
    .kpi-row { grid-template-columns: repeat(5, 1fr); }
  }

  /* Foldable hinge spanning support (Android dual-screen) */
  @media (spanning: single-fold-vertical) {
    .truck-cards { grid-template-columns: 1fr 1fr; }
  }
</style>

<script>
const SUPABASE_URL = 'https://eurnevjtzxansothqney.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SOknLoFYH4_kpCEWSWP-TQ_L9L4PR9o';
const ANTS_URL = 'https://ywslgrusflfuxtrtvlfu.supabase.co';
let ANTS_KEY = localStorage.getItem('ANTS_KEY') || '';
window.setAntsKey = function() {
  const k = prompt('🔑 ใส่ ANTS Supabase key (เก็บใน iPhone เท่านั้น):\n— กด Cancel เพื่อข้าม —', ANTS_KEY || '');
  if (k === null) return;
  ANTS_KEY = k.trim();
  if (ANTS_KEY) localStorage.setItem('ANTS_KEY', ANTS_KEY);
  else localStorage.removeItem('ANTS_KEY');
  location.reload();
};
const THAI_MONTHS_FULL = ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

const ths = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'thira' } });
const sba = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'ants' } });
const ants = ANTS_KEY ? supabase.createClient(ANTS_URL, ANTS_KEY) : null;

const fmtBaht = (n, d='—') => (n == null || n === 0) ? d : Number(n).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});
const fmtBahtFull = (n, d='—') => (n == null || n === 0) ? d : Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtBahtShort = (n, d='—') => {
  if (n == null || n === 0) return d;
  const v = Math.abs(n);
  if (v >= 1_000_000) return (n/1_000_000).toFixed(1) + 'M';
  if (v >= 10_000) return Math.round(n/1000) + 'k';
  return Number(n).toLocaleString('en-US', {maximumFractionDigits:0});
};
const fmtLiter = (n, d='—') => (n == null || n === 0) ? d : Math.round(Number(n)).toLocaleString('en-US');
const fmtDate = iso => { if (!iso) return ''; const [y,m,d] = iso.split('-'); return `${+d}/${+m}/${y}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function setStatus(msg) { const s=document.getElementById('status'); if(msg){s.textContent=msg;s.style.display='';}else{s.style.display='none';} }
function setError(msg) { const e=document.getElementById('error'); if(msg){e.textContent='❌ '+msg;e.style.display='';}else{e.style.display='none';} }

function getCurrent() { const t=new Date(); return `${t.getMonth()+1}.${t.getDate()<16?1:2}/${t.getFullYear()}`; }
function lastDay(y, m) { return new Date(y, m, 0).getDate(); }
function parsePeriod(s) {
  const m = s.trim().match(/^(\d+)\.(\d)\/(\d{4})$/);
  if (!m) throw new Error('รูปแบบ "M.H/YYYY" เช่น 5.2/2026');
  const month=+m[1], half=+m[2], year=+m[3];
  const ld = lastDay(year, month);
  return {year, month, half, start: half===1?`${year}-${String(month).padStart(2,'0')}-01`:`${year}-${String(month).padStart(2,'0')}-16`, end: half===1?`${year}-${String(month).padStart(2,'0')}-15`:`${year}-${String(month).padStart(2,'0')}-${ld}`, halfLabel: half===1?`ครึ่งแรก`:`ครึ่งหลัง`};
}

const BILL1_PREFIXES = ['OGM', 'KNT'];

function isBill1(trip) {
  const inv = (trip.invoice_no || '').toUpperCase();
  return BILL1_PREFIXES.some(p => inv.startsWith(p));
}

// Parse Thai date e.g. "อัพเดต 17 มีนาคม 2569" → "2026-03-17"
function parseThaiDate(text) {
  const m = String(text || '').match(/(\d{1,2})\s+(\S+)\s+(\d{4})/);
  if (!m) return null;
  const day = +m[1];
  const monthIdx = THAI_MONTHS_FULL.indexOf(m[2].trim());
  if (monthIdx < 1) return null;
  const year = +m[3] > 2500 ? +m[3] - 543 : +m[3];
  return `${year}-${String(monthIdx).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}

function findActivePriceSet(priceSets, dateISO) {
  for (const ps of priceSets || []) {
    if (ps.effective_date && ps.effective_date <= dateISO) return ps;
  }
  return null;
}

// Bill price จาก freight_price_sets (fallback ถ้า ANTS ไม่มี)
function billPriceForTrip(trip) {
  const code = trip.factory || (trip.invoice_no || '').slice(0, 3);
  const factoryName = (cache.factoryMap && cache.factoryMap[code]) || code;
  const ps = findActivePriceSet(cache.priceSets, trip.date_in);
  if (!ps || !ps.prices) return { amount: 0, factoryName };
  const amt = +(ps.prices[factoryName] || 0);
  return { amount: amt, factoryName };
}

let cache = {};
async function loadCache() {
  if (cache.trucks) return;
  // separate client for public schema (freight_price_sets)
  const sbpub = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const [tRes, pRes, mRes, fRes] = await Promise.all([
    ths.from('trucks').select('*').neq('plate','XX-XXXX').order('plate'),
    ths.from('prices').select('*'),
    ths.from('prefix_factory_map').select('*'),
    sbpub.from('freight_price_sets').select('id,name,prices,updated_at')
  ]);
  if (tRes.error) throw tRes.error;
  if (pRes.error) throw pRes.error;
  if (mRes.error) throw mRes.error;
  if (fRes.error) throw fRes.error;
  cache.trucks = tRes.data;
  cache.priceMap = {};
  pRes.data.forEach(p => cache.priceMap[p.destination_code] = p);
  cache.factoryMap = {};
  mRes.data.forEach(r => cache.factoryMap[r.prefix] = r.factory_name);
  cache.priceSets = (fRes.data || [])
    .map(ps => ({ ...ps, effective_date: parseThaiDate(ps.name) }))
    .filter(ps => ps.effective_date)
    .sort((a, b) => b.effective_date.localeCompare(a.effective_date));
}

function lookupPrice(factory, invoice) {
  return cache.priceMap[factory || (invoice||'').slice(0,3)] || null;
}

async function fetchTruckData(plate, p) {
  // Lookback 90 วันก่อน period start → หา trips ค้างจ่าย
  const lookback = new Date(p.start);
  lookback.setDate(lookback.getDate() - 90);
  const carryStart = lookback.toISOString().slice(0, 10);

  const [trips, outs, incs, extras, fp, carryRes] = await Promise.all([
    sba.from('containers').select('*').eq('truck_plate', plate).gte('date_in', p.start).lte('date_in', p.end).order('date_in'),
    ths.from('outcomes').select('*').eq('truck_plate', plate).gte('date', p.start).lte('date', p.end).order('date'),
    ths.from('incomes').select('*').eq('truck_plate', plate).gte('date', p.start).lte('date', p.end),
    ths.from('extra_trips').select('*').eq('truck_plate', plate).gte('date', p.start).lte('date', p.end),
    ths.from('fuel_periods').select('*').eq('truck_plate', plate).eq('year', p.year).eq('month', p.month).eq('half', p.half).maybeSingle(),
    sba.from('containers').select('*').eq('truck_plate', plate).gte('date_in', carryStart).lt('date_in', p.start).order('date_in')
  ]);

  let billStatus = {};
  if (ants) {
    const cntNos = [...trips.data, ...carryRes.data].map(t => t.container_no).filter(Boolean);
    if (cntNos.length > 0) {
      try {
        const r = await ants.from('transport_bills').select('container_no,bill_no,price,is_paid').in('container_no', cntNos);
        if (r.data) r.data.forEach(b => billStatus[b.container_no] = b);
      } catch(e){}
    }
  }

  // เหลือเฉพาะ carryover ที่ยังไม่มี bill_no = ค้างจ่าย
  const carryUnpaid = carryRes.data.filter(t => {
    const b = billStatus[t.container_no];
    return !(b && b.bill_no);
  });

  return {
    trips: trips.data, outs: outs.data, incs: incs.data,
    extras: extras.data, fp: fp.data, billStatus, carryUnpaid
  };
}

function compute(truck, p, d) {
  const fuelCol = truck.fuel_route === 1 ? 'fuel_liters_route_1' : 'fuel_liters_route_2';
  let tripTarget = 0, tripFee = 0;
  let bill1 = 0, bill2 = 0, bill1Paid = 0, bill2Paid = 0, bill1Cnt = 0, bill2Cnt = 0, bill1PaidCnt = 0, bill2PaidCnt = 0;

  for (const t of d.trips) {
    const pr = lookupPrice(t.factory, t.invoice_no);
    if (pr) { tripTarget += Number(pr[fuelCol]||0); tripFee += Number(pr.fee_driver||0); }
    const ab = d.billStatus[t.container_no];
    const isPaid = !!(ab && ab.bill_no);
    // ใช้ ANTS price ถ้ามี — ไม่งั้น fallback ไป freight_price_sets (เหมือน dashboard)
    const fallback = billPriceForTrip(t);
    const amt = (ab && ab.price) ? Number(ab.price) : fallback.amount;
    if (isBill1(t)) {
      bill1 += amt; bill1Cnt++; if (isPaid) { bill1Paid += amt; bill1PaidCnt++; }
    } else {
      bill2 += amt; bill2Cnt++; if (isPaid) { bill2Paid += amt; bill2PaidCnt++; }
    }
  }

  // Carryover (trips ค้างจ่ายจากรอบก่อน)
  let carryBill1 = 0, carryBill2 = 0, carryBill1Cnt = 0, carryBill2Cnt = 0;
  for (const t of (d.carryUnpaid || [])) {
    const ab = d.billStatus[t.container_no];
    const fallback = billPriceForTrip(t);
    const amt = (ab && ab.price) ? Number(ab.price) : fallback.amount;
    if (isBill1(t)) { carryBill1 += amt; carryBill1Cnt++; }
    else            { carryBill2 += amt; carryBill2Cnt++; }
  }
  const carryBillTotal = carryBill1 + carryBill2;
  const carryBillCnt = carryBill1Cnt + carryBill2Cnt;

  const refills = d.outs.filter(o => o.category === 'ค่าน้ำมัน');
  const refillL = refills.reduce((s,o) => s + Number(o.liters||0), 0);
  const refillB = refills.reduce((s,o) => s + Number(o.amount), 0);
  const extraL = (d.extras||[]).reduce((s,e) => s + Number(e.liters||0), 0);
  const carryIn = d.fp ? Number(d.fp.opening_liters||0) : 0;
  const bonus = d.fp ? Number(d.fp.bonus_liters||0) : 0;
  const required = carryIn + tripTarget + extraL;
  const totalRefill = refillL + bonus;
  const carryOut = required - totalRefill;
  const income = d.incs.reduce((s,i) => s + Number(i.amount_net), 0);
  const outcome = d.outs.reduce((s,o) => s + Number(o.amount), 0);
  const profit = income - outcome;
  const baseSal = Number(truck.monthly_salary||0);
  const salaryDue = p.half === 2 ? baseSal : 0;
  const driverFee = tripFee + salaryDue;

  const totalBill = bill1 + bill2;
  const totalPaid = bill1Paid + bill2Paid;
  const totalPending = totalBill - totalPaid;

  return {
    trips: d.trips.length, tripFee, tripTarget, refillL, refillB,
    bill1, bill2, bill1Paid, bill2Paid, bill1Cnt, bill2Cnt, bill1PaidCnt, bill2PaidCnt,
    totalBill, totalPaid, totalPending,
    // Carryover (รอบก่อนค้างจ่าย)
    carryBill1, carryBill2, carryBillTotal, carryBill1Cnt, carryBill2Cnt, carryBillCnt,
    // Grand totals (รวมรอบนี้ + carryover)
    grandTotalBill: totalBill + carryBillTotal,
    grandTotalPending: totalPending + carryBillTotal,
    income, outcome, profit, baseSal, driverFee, carryIn, carryOut
  };
}

function renderTruckCards(p, summaries) {
  const fleet = summaries.reduce((acc, s) => {
    acc.totalBill += s.sum.totalBill; acc.totalPaid += s.sum.totalPaid;
    acc.pending += s.sum.totalPending; acc.trips += s.sum.trips;
    acc.driverPay += s.sum.driverFee;
    acc.carryBillTotal += s.sum.carryBillTotal;
    acc.carryBillCnt += s.sum.carryBillCnt;
    acc.grandTotalBill += s.sum.grandTotalBill;
    acc.grandTotalPending += s.sum.grandTotalPending;
    return acc;
  }, {totalBill:0, totalPaid:0, pending:0, trips:0, driverPay:0, carryBillTotal:0, carryBillCnt:0, grandTotalBill:0, grandTotalPending:0});

  const carryHint = fleet.carryBillTotal > 0
    ? `<div style="font-size:11px;color:#92400e;margin-top:2px">⏳ ค้างเก่า ${fmtBahtShort(fleet.carryBillTotal)}</div>`
    : '';

  let html = `
    <div class="section">📊 ภาพรวม — ${THAI_MONTHS_FULL[p.month]} ${p.year+543}</div>
    <div class="fleet-kpi">
      <div class="fleet-grid">
        <div class="fleet-cell">
          <div class="label">เที่ยวรวม</div>
          <div class="value">${fleet.trips} เที่ยว</div>
          ${fleet.carryBillCnt > 0 ? `<div style="font-size:11px;color:#92400e;margin-top:2px">+${fleet.carryBillCnt} เก่า</div>` : ''}
        </div>
        <div class="fleet-cell">
          <div class="label">วางบิลรวม</div>
          <div class="value">${fmtBaht(fleet.grandTotalBill)}</div>
          ${carryHint}
        </div>
        <div class="fleet-cell paid">
          <div class="label">จ่ายแล้ว</div>
          <div class="value">${fmtBaht(fleet.totalPaid)}</div>
        </div>
        <div class="fleet-cell pending">
          <div class="label">ค้างชำระ</div>
          <div class="value">${fmtBaht(fleet.grandTotalPending)}</div>
          ${carryHint}
        </div>
      </div>
    </div>

    <div class="section">🚛 รถ 6 คัน</div>
    <div class="cards-wrap">
  `;

  for (const s of summaries) {
    const t = s.truck, sum = s.sum;
    const profitClass = sum.profit >= 0 ? 'pos' : 'neg';
    const profitSign = sum.profit >= 0 ? '+' : '';
    const fuelClass = sum.carryOut > 50 ? 'fuel-danger' : (sum.carryOut > 0 ? 'fuel-warn' : 'fuel-ok');
    const fuelLabel = sum.carryOut > 0 ? `ค้าง ${fmtLiter(sum.carryOut)} ล.` :
                       (sum.carryOut < 0 ? `เกิน ${fmtLiter(Math.abs(sum.carryOut))} ล.` : 'พอดี');
    html += `
      <div class="truck-card" onclick="showDetail('${t.plate}')">
        <div class="tc-header">
          <div class="tc-info">
            <div class="tc-plate">${esc(t.plate)}</div>
            <div class="tc-driver">${esc(t.driver_name)}</div>
          </div>
          <div>
            <div class="tc-profit ${profitClass}">${profitSign}${fmtBaht(sum.profit)}</div>
            <div class="tc-profit-label" style="text-align:right">กำไรรอบนี้</div>
          </div>
        </div>
        <div class="tc-stats">
          <div class="tc-stat"><span class="v">${sum.trips}</span>เที่ยว</div>
          <div class="tc-stat"><span class="v">${fmtBahtShort(sum.income)}</span>รายรับ</div>
          <div class="tc-stat"><span class="v">${fmtBahtShort(sum.outcome)}</span>รายจ่าย</div>
        </div>
        <div class="tc-badges">
          <div class="badge bill1">
            <span class="name">บิล1 OGM</span>
            <span>${sum.bill1PaidCnt}/${sum.bill1Cnt}${sum.carryBill1Cnt > 0 ? ` +${sum.carryBill1Cnt}เก่า` : ''}</span>
          </div>
          <div class="badge bill2">
            <span class="name">บิล2 อื่น</span>
            <span>${sum.bill2PaidCnt}/${sum.bill2Cnt}${sum.carryBill2Cnt > 0 ? ` +${sum.carryBill2Cnt}เก่า` : ''}</span>
          </div>
        </div>
        ${sum.carryBillTotal > 0 ? `
          <div style="margin-top:6px;background:#fef3c7;border:1px solid #fde68a;color:#92400e;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:600">
            ⏳ ค้างจากรอบก่อน ${sum.carryBillCnt} เที่ยว • ${fmtBahtShort(sum.carryBillTotal)} บ.
          </div>
        ` : ''}
        <div class="tc-fuel">
          <div class="badge ${fuelClass}">
            <span class="name">⛽ น้ำมัน</span>
            <span>${fuelLabel}</span>
          </div>
        </div>
      </div>
    `;
  }
  html += `</div>`;
  document.getElementById('report').innerHTML = html;
}

async function reload() {
  try {
    setError(null);
    const periodStr = document.getElementById('period-input').value.trim() || getCurrent();
    document.getElementById('period-input').value = periodStr;
    setStatus(`กำลังโหลด ${periodStr}...`);
    const p = parsePeriod(periodStr);
    await loadCache();
    const summaries = [];
    for (const truck of cache.trucks) {
      const data = await fetchTruckData(truck.plate, p);
      summaries.push({ truck, data, sum: compute(truck, p, data) });
    }
    cache.lastSummaries = summaries;
    cache.lastPeriod = p;
    renderTruckCards(p, summaries);
    setStatus(null);
  } catch (e) {
    setStatus(null);
    setError(e.message);
    console.error(e);
  }
}

function changePeriod(delta) {
  try {
    const p = parsePeriod(document.getElementById('period-input').value.trim() || getCurrent());
    let {year, month, half} = p;
    if (delta > 0) { if (half === 1) half = 2; else { half = 1; month++; if (month > 12) {month=1; year++;} } }
    else { if (half === 2) half = 1; else { half = 2; month--; if (month < 1) {month=12; year--;} } }
    document.getElementById('period-input').value = `${month}.${half}/${year}`;
    reload();
  } catch (e) { setError(e.message); }
}

function showDetail(plate) {
  const s = cache.lastSummaries.find(x => x.truck.plate === plate);
  if (!s) return;
  const p = cache.lastPeriod;
  const t = s.truck, sum = s.sum, d = s.data;
  const profitClass = sum.profit >= 0 ? 'pos' : 'neg';

  const tripList = d.trips.slice(0, 10).map(tr => {
    const pr = lookupPrice(tr.factory, tr.invoice_no);
    const fee = pr ? Number(pr.fee_driver||0) : 0;
    const label = tr.factory || (tr.invoice_no||'').slice(0,12);
    return `<div class="detail-list-item">
      <div class="l">
        <div>${esc(label.slice(0,22))}</div>
        <div class="meta">${fmtDate(tr.date_in)} • ${esc((tr.invoice_no||'').slice(0,16))}</div>
      </div>
      <div class="r">${fmtBahtFull(fee)} บ.</div>
    </div>`;
  }).join('') || '<div class="empty">— ไม่มีเที่ยว —</div>';

  const otherCosts = d.outs.filter(o => o.category !== 'ค่าน้ำมัน' && !['ค่าเที่ยวคนขับ','ค่าล่วง','เงินเดือน'].includes(o.category));
  const otherList = otherCosts.slice(0, 10).map(o => `<div class="detail-list-item">
    <div class="l">
      <div>${esc(o.category)}</div>
      <div class="meta">${fmtDate(o.date)}${o.note ? ' • ' + esc(o.note.slice(0,30)) : ''}</div>
    </div>
    <div class="r">${fmtBahtFull(o.amount)} บ.</div>
  </div>`).join('') || '<div class="empty">— ไม่มี —</div>';

  const html = `
    <div class="detail-handle"></div>
    <button class="detail-close" onclick="closeDetail()">✕</button>
    <div class="detail-header">
      <h2>🚛 ${esc(t.plate)}</h2>
      <div class="sub">${esc(t.driver_name)} • ${THAI_MONTHS_FULL[p.month]} ${p.year+543} ${p.halfLabel}</div>
    </div>

    <div class="detail-section">
      <h3>💰 สรุปการเงิน</h3>
      <div class="detail-row"><span class="lbl">เที่ยวที่วิ่ง</span><span class="val">${sum.trips} เที่ยว</span></div>
      <div class="detail-row"><span class="lbl">รายรับ (net)</span><span class="val">${fmtBahtFull(sum.income)}</span></div>
      <div class="detail-row"><span class="lbl">รายจ่าย</span><span class="val">${fmtBahtFull(sum.outcome)}</span></div>
      <div class="detail-row total">
        <span class="lbl">กำไรรอบนี้</span>
        <span class="val ${profitClass}">${sum.profit>=0?'+':''}${fmtBahtFull(sum.profit)}</span>
      </div>
    </div>

    <div class="detail-section">
      <h3>📋 วางบิล ANTS</h3>
      <div class="detail-row">
        <span class="lbl">บิล 1 (OGM+KNT)</span>
        <span class="val">${fmtBahtFull(sum.bill1)} · จ่าย ${sum.bill1PaidCnt}/${sum.bill1Cnt}</span>
      </div>
      <div class="detail-row">
        <span class="lbl">บิล 2 (อื่นๆ)</span>
        <span class="val">${fmtBahtFull(sum.bill2)} · จ่าย ${sum.bill2PaidCnt}/${sum.bill2Cnt}</span>
      </div>
      ${sum.carryBillTotal > 0 ? `
        <div class="detail-row" style="background:#fef3c7;border-radius:6px;padding:6px 8px;margin:4px -8px">
          <span class="lbl" style="color:#92400e">⏳ ค้างจากรอบก่อน (${sum.carryBillCnt} เที่ยว)</span>
          <span class="val" style="color:#92400e;font-weight:600">${fmtBahtFull(sum.carryBillTotal)}</span>
        </div>
      ` : ''}
      <div class="detail-row total">
        <span class="lbl">ค้างชำระทั้งหมด</span>
        <span class="val neg">${fmtBahtFull(sum.grandTotalPending)}</span>
      </div>
    </div>

    <div class="detail-section">
      <h3>⛽ น้ำมัน</h3>
      <div class="detail-row"><span class="lbl">ค้างจากรอบก่อน</span><span class="val">${fmtLiter(sum.carryIn)} ล.</span></div>
      <div class="detail-row"><span class="lbl">ใช้ตามเป้า</span><span class="val">${fmtLiter(sum.tripTarget)} ล.</span></div>
      <div class="detail-row"><span class="lbl">เติมจริง</span><span class="val">${fmtLiter(sum.refillL)} ล. · ${fmtBahtFull(sum.refillB)}</span></div>
      <div class="detail-row total">
        <span class="lbl">${sum.carryOut>=0?'ค้างต้องเติม':'เติมเกิน'}</span>
        <span class="val ${sum.carryOut>0?'neg':(sum.carryOut<0?'pos':'')}">${sum.carryOut>=0?'−':'+'}${fmtLiter(Math.abs(sum.carryOut))} ล.</span>
      </div>
    </div>

    <div class="detail-section">
      <h3>💼 จ่ายคนขับรอบนี้</h3>
      <div class="detail-row"><span class="lbl">ค่าเที่ยว (${sum.trips} เที่ยว)</span><span class="val">${fmtBahtFull(sum.tripFee)}</span></div>
      <div class="detail-row"><span class="lbl">เงินเดือน ${p.half===2?'(จ่ายครึ่งหลัง)':'(รอครึ่งหลัง)'}</span><span class="val">${fmtBahtFull(p.half===2?sum.baseSal:0)}</span></div>
      <div class="detail-row total">
        <span class="lbl">รวมจ่าย</span>
        <span class="val">${fmtBahtFull(sum.driverFee)} บ.</span>
      </div>
    </div>

    <div class="detail-section">
      <h3>🛣️ เที่ยวล่าสุด (${d.trips.length})</h3>
      ${tripList}
    </div>

    <div class="detail-section">
      <h3>💸 รายจ่ายอื่นๆ (${otherCosts.length})</h3>
      ${otherList}
    </div>
  `;
  document.getElementById('detail-sheet').innerHTML = html;
  document.getElementById('detail-overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('show');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
document.getElementById('period-input').addEventListener('keydown', e => { if (e.key === 'Enter') { e.target.blur(); reload(); } });

document.getElementById('period-input').value = getCurrent();
reload();

// ──────────────────────────────────────────────────────────
// PWA install — รับ event "beforeinstallprompt" จาก Android Chrome
// → แสดงปุ่ม ⬇ ใน top bar ให้ user กดติดตั้ง
// (iPhone Safari ไม่ trigger event นี้ — user ต้อง Share → Add to Home Screen เอง)
// ──────────────────────────────────────────────────────────
let __deferredPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  __deferredPrompt = e;
  const btn = document.getElementById('install-btn');
  if (btn) btn.style.display = 'inline-flex';
});

window.installApp = async function() {
  if (!__deferredPrompt) {
    // iPhone fallback
    const ua = navigator.userAgent;
    if (/iPhone|iPad|iPod/.test(ua)) {
      alert('🍎 บน iPhone/iPad:\n\n1. กดปุ่ม Share (รูปสี่เหลี่ยมลูกศรขึ้น) ในแถบเครื่องมือ\n2. เลื่อนหา "Add to Home Screen" / "เพิ่มที่หน้าจอหลัก"\n3. กด Add → ไอคอน THIRA จะปรากฏที่หน้าจอหลัก');
    } else {
      alert('แอปติดตั้งไว้แล้ว หรือเบราว์เซอร์ไม่รองรับ — ลองเปิดผ่าน Chrome หรือ Samsung Internet');
    }
    return;
  }
  __deferredPrompt.prompt();
  const { outcome } = await __deferredPrompt.userChoice;
  console.log('Install outcome:', outcome);
  __deferredPrompt = null;
  const btn = document.getElementById('install-btn');
  if (btn) btn.style.display = 'none';
};

// ซ่อนปุ่มถ้าติดตั้งแล้ว
window.addEventListener('appinstalled', () => {
  const btn = document.getElementById('install-btn');
  if (btn) btn.style.display = 'none';
});
